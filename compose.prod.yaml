# Staging / production overlay (single VM). Use with:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.production up -d
# Managed MySQL is strongly preferred in production: point DATABASE_URL at it and
# scale the bundled mysql service to 0 (`--scale mysql=0`), adjusting depends_on.
services:
  migrate:
    environment:
      APP_ENV: ${APP_ENV:-production}

  backend:
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_JSON: "true"
    deploy:
      replicas: 2   # motors are spread across replicas via the Redis ownership lock
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  frontend:
    ports: !reset []

  edge:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [frontend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
