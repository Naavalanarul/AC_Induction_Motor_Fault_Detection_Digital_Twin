# Local stack: MySQL + Redis + one-shot migration + backend + frontend (nginx).
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8080/api/v1/docs
name: motor-dt

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_twin}
      MYSQL_USER: ${MYSQL_USER:-dt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Schema migrations are an explicit, separate step -- never run silently by the app.
  migrate:
    build: ./backend
    image: ${IMAGE_PREFIX:-motor-dt}/backend:${IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dt}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-digital_twin}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${IMAGE_PREFIX:-motor-dt}/backend:${IMAGE_TAG:-local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dt}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-digital_twin}
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ${IMAGE_PREFIX:-motor-dt}/frontend:${IMAGE_TAG:-local}
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
