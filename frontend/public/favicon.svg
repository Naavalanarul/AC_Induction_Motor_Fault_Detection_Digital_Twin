<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="tc-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00e5ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rotated Diamond Outer Node (Twin-Core Brand Node) -->
  <rect
    x="13"
    y="13"
    width="38"
    height="38"
    rx="8"
    transform="rotate(45 32 32)"
    fill="url(#tc-bg)"
    stroke="#00e5ff"
    stroke-width="2"
    stroke-opacity="0.85"
    filter="url(#tc-glow)"
  />

  <!-- 3D Digital Twin Core (Isometric Hexagonal Cube) -->
  <g transform="translate(32 32) scale(1.35) translate(-12 -12)">
    <!-- Top Face -->
    <path
      d="M12 2.5 L20 7 L12 11.5 L4 7 Z"
      fill="#00e5ff"
      fill-opacity="0.28"
    />
    <!-- Left Face -->
    <path
      d="M4 7 L12 11.5 L12 21.5 L4 17 Z"
      fill="#00e5ff"
      fill-opacity="0.12"
    />
    <!-- Right Face -->
    <path
      d="M12 11.5 L20 7 L20 17 L12 21.5 Z"
      fill="#00e5ff"
      fill-opacity="0.2"
    />

    <!-- Outer Contour & Rounded Chamfer -->
    <path
      d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
      stroke="url(#tc-cyan)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Inner Y-junction Lines -->
    <path
      d="m3.3 7 8.7 5 8.7-5"
      stroke="url(#tc-cyan)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M12 22V12"
      stroke="url(#tc-cyan)"
      stroke-width="1.8"
      stroke-linecap="round"
    />
  </g>
</svg>