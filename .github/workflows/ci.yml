name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app migrations
      - run: mypy app --exclude app/tests

  backend-test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Unit + API tests on SQLite, incl. the frozen ML validation set (accuracy regression guard)
      - run: pytest -q --cov=app --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with: {name: coverage-backend, path: backend/coverage.xml}

  backend-integration:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: digital_twin_test
          MYSQL_USER: dt
          MYSQL_PASSWORD: dtpw
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -udt -pdtpw --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://dt:dtpw@127.0.0.1:3306/digital_twin_test
      TEST_DATABASE_URL: mysql+pymysql://dt:dtpw@127.0.0.1:3306/digital_twin_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Migrations apply, match the models, and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: API contract tests against real MySQL + Redis broker tests
        run: pytest -q app/tests/api app/tests/runtime

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  e2e:
    needs: [backend-test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install --require-hashes -r backend/requirements.txt
      - name: Start backend (SQLite, rule-based ML fallback)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          AUTO_CREATE_SCHEMA: "true"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin-pass-123
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
          USE_ML: "false"
        run: |
          nohup uvicorn app.main:create_app --factory --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 2; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: e2e-debug, path: "backend.log\nfrontend/test-results\nfrontend/e2e-results"}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install pip-audit
      - run: pip-audit --strict -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    needs: [backend-lint, backend-test, backend-integration, frontend, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images tagged with the commit SHA
        run: |
          OWNER=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          docker build -t $OWNER/motor-dt-backend:${{ github.sha }} backend
          docker build -t $OWNER/motor-dt-frontend:${{ github.sha }} frontend
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.OWNER }}/motor-dt-backend:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push (main branch and tags only)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in backend frontend; do
            docker push $OWNER/motor-dt-$img:${{ github.sha }}
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              docker tag $OWNER/motor-dt-$img:${{ github.sha }} $OWNER/motor-dt-$img:${GITHUB_REF_NAME}
              docker push $OWNER/motor-dt-$img:${GITHUB_REF_NAME}
            fi
          done

  # Release tags deploy to staging automatically, then production after a manual approval
  # (configure required reviewers on the "production" environment). Needs the secrets
  # DEPLOY_HOST_STAGING / DEPLOY_HOST_PRODUCTION / DEPLOY_SSH_KEY, and deploy/deploy.sh on the VM.
  deploy-staging:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, e2e]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$HOST" "cd /opt/motor-dt && IMAGE_TAG=${GITHUB_REF_NAME} ./deploy/deploy.sh staging"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST_PRODUCTION }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$HOST" "cd /opt/motor-dt && IMAGE_TAG=${GITHUB_REF_NAME} ./deploy/deploy.sh production"
