[project]
name = "backend"
version = "1.0.0"
description = "AC induction motor fault-detection digital twin: simulation, diagnostics, supervisory control and API"
authors = [
    {name = "Naavalanarul",email = "101957723+Naavalanarul@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.13,<2.0)",
    "PyWavelets (>=1.6,<2.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)",
    "pymysql (>=1.1,<2.0)",
    "cryptography (>=42)",
    "pyjwt (>=2.8,<3.0)",
    "bcrypt (>=4.1,<6.0)",
    "prometheus-client (>=0.20,<1.0)",
    "redis (>=5.0,<8.0)",
]

[project.optional-dependencies]
# PyTorch is optional: without it the vibration/acoustic channel falls back to
# the rule-based envelope-order classifier and everything else keeps working.
ml = ["torch (>=2.2)"]
dev = ["pytest (>=8)", "pytest-cov (>=5)", "httpx (>=0.27)", "ruff (>=0.5)", "mypy (>=1.10)", "websockets (>=12)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "app"}]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
markers = [
    "slow: long-running simulation/ML tests",
    "mysql: requires a live MySQL (DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/ml/train.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
